name: Build Northern Iran Offline Map

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/offline-map-pack.yml"
      - "docs/offline-maps-migration.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-map-pack.yml"
      - "docs/offline-maps-migration.md"

permissions:
  contents: read

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install map data tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Download current OpenStreetMap Iran extract
        run: |
          mkdir -p data
          curl -fL --retry 3 --retry-delay 5 \
            https://download.geofabrik.de/asia/iran-latest.osm.pbf \
            -o data/iran-latest.osm.pbf
          ls -lh data/iran-latest.osm.pbf
      - name: Extract the northern provinces region
        run: |
          set -euo pipefail
          osmium extract --strategy=smart \
            --bbox 48.0,35.4,57.5,38.6 \
            --output data/northern-iran.osm.pbf \
            data/iran-latest.osm.pbf
          test -s data/northern-iran.osm.pbf
          ls -lh data/northern-iran.osm.pbf
      - name: Build vector tiles as PMTiles
        run: |
          set -euo pipefail
          docker run --rm --memory=5g \
            -v "$PWD/data:/data" \
            ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/northern-iran.osm.pbf \
            --output=/data/northern-iran.pmtiles \
            --bounds=48.0,35.4,57.5,38.6 \
            --maxzoom=14 \
            --force
          test -s data/northern-iran.pmtiles
          python3 - <<'PY'
          from pathlib import Path
          p = Path("data/northern-iran.pmtiles")
          with p.open("rb") as f:
              signature = f.read(7)
          if signature != b"PMTiles":
              raise SystemExit(f"Invalid PMTiles signature: {signature!r}")
          print(f"Validated PMTiles archive: {p.stat().st_size:,} bytes")
          PY
      - name: Write map package manifest and attribution
        run: |
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          archive = Path("data/northern-iran.pmtiles")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {
            "name": "سفر یار ترکمن - نقشه آفلاین شمال ایران",
            "region": "Golestan, Mazandaran, Gilan and adjacent border coverage",
            "bounds": {"west": 48.0, "south": 35.4, "east": 57.5, "north": 38.6},
            "maxZoom": 14,
            "format": "PMTiles",
            "schema": "OpenMapTiles (Planetiler default profile)",
            "source": "OpenStreetMap via Geofabrik Iran extract",
            "generatedAt": datetime.now(timezone.utc).isoformat(),
            "sha256": digest,
            "sizeBytes": archive.stat().st_size,
            "license": "Open Database License (ODbL)",
            "attribution": "© OpenStreetMap contributors",
            "notice": "Coverage is a bounding rectangle including the three northern provinces and some adjacent areas; it is not clipped to administrative province borders."
          }
          Path("data/manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("data/ATTRIBUTION.txt").write_text(
            "Map data © OpenStreetMap contributors.\n"
            "Source: Geofabrik Iran extract.\n"
            "Data is available under the Open Database License (ODbL).\n"
            "This archive is a derived database; see https://www.openstreetmap.org/copyright and https://www.geofabrik.de/ for license and attribution details.\n",
            encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-northern-iran-offline-map
          path: |
            data/northern-iran.pmtiles
            data/manifest.json
            data/ATTRIBUTION.txt
          if-no-files-found: error
          retention-days: 30
