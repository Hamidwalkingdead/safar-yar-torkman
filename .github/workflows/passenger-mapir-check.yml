name: Passenger Map.ir integration check

on:
  push:
    branches:
      - fix/passenger-mapir-provider
    paths:
      - "src/components/passenger-mapir-picker.tsx"
      - "src/lib/mapir.functions.ts"
      - "src/routes/passenger.tsx"
      - ".env.example"
      - ".github/workflows/passenger-mapir-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passenger-web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_APP_TARGET: passenger
      VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run project tests
        run: bun run test
      - name: Lint passenger map integration
        run: bunx eslint src/components/passenger-mapir-picker.tsx src/lib/mapir.functions.ts src/routes/passenger.tsx
      - name: Type-check TypeScript project
        run: bunx tsc --noEmit -p tsconfig.mapir.json
      - name: Build passenger app shell (no APK)
        run: |
          set -euo pipefail
          bun run build
          test -s .output/public/_shell.html
          grep -R -q "mapir-style-dark.json" .output/public/assets
          grep -R -q "unpkg.com/maplibre-gl@6.14.0" .output/public/assets
          grep -R -q "OpenStreetMap contributors" .output/public/assets
          echo "Passenger web shell built with Map.ir provider and required attribution. No Android APK was assembled."
