name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRIP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/trip_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check \
            supabase/functions/create-trip/index.ts \
            supabase/functions/neshan-route/index.ts \
            supabase/functions/neshan-reverse/index.ts \
            supabase/functions/neshan-search/index.ts \
            supabase/functions/kavenegar-send-sms/index.ts
      - name: Test Edge Function input validation
        run: deno test supabase/functions/_shared/validation.test.ts
      - name: Run lint
        run: bun run lint
      - name: Run tests
        run: bun run test
      - name: Build application
        run: bun run build
