name: Balad Deno Compatibility Probe

on:
  push:
    branches: [experimental/balad-service-adapter]
    paths:
      - "balad-map-diagnostics/test_deno_fetch.ts"
      - "supabase/functions/neshan-search/**"
      - "supabase/functions/neshan-reverse/**"
      - "supabase/functions/neshan-route/**"
      - "supabase/functions/_shared/**"
      - "src/lib/geo.ts"
      - "src/components/route-map.tsx"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/balad-deno-compat.yml"

permissions:
  contents: read

jobs:
  deno-fetch-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Probe Balad endpoints with native Deno fetch
        run: deno run --allow-net balad-map-diagnostics/test_deno_fetch.ts
      - name: Type-check Balad-backed Supabase Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/neshan-search/index.ts
          deno check --node-modules-dir=none supabase/functions/neshan-reverse/index.ts
          deno check --node-modules-dir=none supabase/functions/neshan-route/index.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Run app tests (no Android build)
        run: bun run test
      - name: Run ESLint (no Android build)
        run: bun run lint
