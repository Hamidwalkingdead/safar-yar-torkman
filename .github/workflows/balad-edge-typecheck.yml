name: Balad Edge Function Type Check

on:
  push:
    branches:
      - experimental/balad-service-adapter
    paths:
      - "supabase/functions/neshan-search/**"
      - "supabase/functions/neshan-reverse/**"
      - "supabase/functions/neshan-route/**"
      - "supabase/functions/_shared/**"
      - "src/lib/geo.ts"
      - "src/components/route-map.tsx"
      - ".github/workflows/balad-edge-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Balad-backed Supabase Edge Functions
        run: |
          deno check supabase/functions/neshan-search/index.ts
          deno check supabase/functions/neshan-reverse/index.ts
          deno check supabase/functions/neshan-route/index.ts
