name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor tooling in isolation
        run: |
          mkdir -p /tmp/capacitor-tools
          cd /tmp/capacitor-tools
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cd "$GITHUB_WORKSPACE"
          mkdir -p node_modules/@capacitor
          ln -s /tmp/capacitor-tools/node_modules/@capacitor/core node_modules/@capacitor/core
          ln -s /tmp/capacitor-tools/node_modules/@capacitor/cli node_modules/@capacitor/cli
          ln -s /tmp/capacitor-tools/node_modules/@capacitor/android node_modules/@capacitor/android
          echo "/tmp/capacitor-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare web assets
        run: |
          mkdir -p dist
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > dist/index.html
      - name: Generate Android project
        run: |
          cap add android
          cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
