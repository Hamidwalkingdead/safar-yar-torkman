# Re-run Android packaging after the previous runner-side failure.
name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: bun install
      - name: Commit refreshed Bun lockfile on pull request
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): refresh Bun lockfile'
            git push origin HEAD:${{ github.head_ref }}
          else
            echo 'Bun lockfile is already up to date.'
          fi
      - name: Run lint
        run: bun run lint
      - name: Run project tests
        run: bun run test
      - name: Verify mobile runtime configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Supabase URL is missing. Configure SUPABASE_URL or VITE_SUPABASE_URL in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase publishable key is missing. Configure SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi
          echo "Supabase URL and publishable key are configured."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
      - name: Build actual web application
        run: bun run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sptzdfopwkxdprtqjocw' }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          NESHAN_SERVICE_KEY: ${{ secrets.NESHAN_SERVICE_KEY }}
      - name: Create Capacitor HTML entry point
        run: |
          test -s .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
          test -s .output/public/index.html
      - name: Install Capacitor tooling
        run: |
          npm install --global @capacitor/cli@7
          echo "Capacitor Android runtime is installed from bun.lock."
      - name: Create or synchronize persistent native Android project
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p android/app/src/main/assets
          printf '%s\n' '.gradle/' '**/build/' 'local.properties' 'app/src/main/assets/public/' > android/.gitignore
      - name: Save native Android project into repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android
          if ! git diff --cached --quiet; then
            git commit -m 'Add persistent native Android project'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'Native Android project is already up to date.'
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK output
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
      - name: Verify background location plugin and Android permissions
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          for permission in \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.POST_NOTIFICATIONS; do
            echo "$PERMISSIONS" | grep -q "$permission" || {
              echo "::error::Missing Android permission: $permission"
              exit 1
            }
          done
          echo "$MANIFEST" | grep -q "com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService"
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor-community/background-geolocation"
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor/local-notifications"
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"useLegacyBridge": true'
          echo "Background location service, permissions, plugins, and legacy bridge verified in APK."
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

