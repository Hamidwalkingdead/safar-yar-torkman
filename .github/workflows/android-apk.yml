# Build and verify three independent Android APKs (passenger, driver, admin).
name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "supabase/config.toml"
      - "supabase/functions/neshan-*/**"
      - "supabase/functions/_shared/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "supabase/config.toml"
      - "supabase/functions/neshan-*/**"
      - "supabase/functions/_shared/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
      - name: Run project tests
        run: bun run test
      - name: Verify mobile runtime configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Supabase URL is missing. Configure SUPABASE_URL or VITE_SUPABASE_URL in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase publishable key is missing. Configure SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi
          echo "Supabase URL and publishable key are configured."
          if [ -z "${NESHAN_SERVICE_KEY}${NESHAN_ROUTE_KEY}${NESHAN_REVERSE_KEY}" ]; then
            echo "::error::Add a Neshan Service key for route and reverse geocoding."
            exit 1
          fi
          if [ -z "$NESHAN_MAP_KEY" ]; then
            echo "::error::NESHAN_MAP_KEY is missing; interactive Neshan maps cannot load."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          NESHAN_SERVICE_KEY: ${{ secrets.NESHAN_SERVICE_KEY }}
          NESHAN_ROUTE_KEY: ${{ secrets.NESHAN_ROUTE_KEY }}
          NESHAN_REVERSE_KEY: ${{ secrets.NESHAN_REVERSE_KEY }}
          NESHAN_SEARCH_KEY: ${{ secrets.NESHAN_SEARCH_KEY }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
      - name: Verify Supabase and all Neshan services
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          NESHAN_SERVICE_KEY: ${{ secrets.NESHAN_SERVICE_KEY }}
          NESHAN_ROUTE_KEY: ${{ secrets.NESHAN_ROUTE_KEY || secrets.NESHAN_SERVICE_KEY }}
          NESHAN_REVERSE_KEY: ${{ secrets.NESHAN_REVERSE_KEY }}
          NESHAN_SEARCH_KEY: ${{ secrets.NESHAN_SEARCH_KEY }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
        run: |
          set -euo pipefail
          test -n "$NESHAN_ROUTE_KEY" || { echo "::error::NESHAN_ROUTE_KEY or NESHAN_SERVICE_KEY is required."; exit 1; }
          test -n "$NESHAN_MAP_KEY" || { echo "::error::NESHAN_MAP_KEY is required for the Neshan map."; exit 1; }

          SUPABASE_STATUS="$(curl -sS --max-time 15 -o /tmp/supabase-health.json -w '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")"
          test "$SUPABASE_STATUS" = "200" || { echo "::error::Supabase Auth health returned HTTP $SUPABASE_STATUS."; exit 1; }
          echo "Supabase Auth health check passed."

          curl -fsS --retry 2 --max-time 25 \
            -H "Api-Key: $NESHAN_ROUTE_KEY" \
            'https://api.neshan.org/v4/direction?type=car&origin=37.25,55.17&destination=35.69,51.39' \
            -o /tmp/neshan-route.json
          python3 - <<'PY'
          import json
          with open("/tmp/neshan-route.json", encoding="utf-8") as f:
              payload = json.load(f)
          routes = payload.get("routes") or []
          legs = routes[0].get("legs") or [] if routes else []
          distance = sum((leg.get("distance") or {}).get("value", 0) for leg in legs)
          duration = sum((leg.get("duration") or {}).get("value", 0) for leg in legs)
          if distance <= 0 or duration <= 0 or not (routes[0].get("overview_polyline") or {}).get("points"):
              raise SystemExit("Neshan Directions returned no usable road route.")
          print(f"Neshan road routing passed: {distance} m, {duration} sec.")
          PY

          curl -fsS --retry 2 --max-time 25 -X POST \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"lat":37.25,"lng":55.17}' \
            "$VITE_SUPABASE_URL/functions/v1/neshan-reverse" -o /tmp/neshan-edge-reverse.json
          python3 - <<'PY'
          import json
          with open("/tmp/neshan-edge-reverse.json", encoding="utf-8") as f:
              payload = json.load(f)
          if not (payload.get("name") or "").strip():
              raise SystemExit("Supabase Neshan reverse function returned no readable address.")
          print("Supabase Neshan reverse geocoding passed.")
          PY

          if [ -n "$NESHAN_SEARCH_KEY" ]; then
            curl -fsS --retry 2 --max-time 20 -G \
              -H "Api-Key: $NESHAN_SEARCH_KEY" \
              --data-urlencode "term=گنبد کاووس" \
              --data-urlencode "lat=37.25" \
              --data-urlencode "lng=55.17" \
              'https://api.neshan.org/v1/search' -o /tmp/neshan-search.json
            python3 -c 'import json; p=json.load(open("/tmp/neshan-search.json", encoding="utf-8")); items=p.get("items") or []; assert items and (items[0].get("location") or {}).get("x"), "Neshan place search returned no usable result."; print("Neshan place search passed.")'
          else
            echo "::warning::NESHAN_SEARCH_KEY is not mirrored to GitHub; search smoke test skipped. The Supabase NESHAN_SEARCH_KEY secret must already be configured."
          fi

          curl -fsS --retry 2 --max-time 20 \
            'https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.js' -o /tmp/neshan-leaflet.js
          test -s /tmp/neshan-leaflet.js
          echo "Neshan Leaflet SDK CDN check passed."

          curl -fsS --retry 2 --max-time 20 \
            'https://static.neshan.org/sdk/maplibre/styles/light.json' -o /tmp/neshan-maplibre-style.json
          python3 - <<'PY'
          import json
          with open("/tmp/neshan-maplibre-style.json", encoding="utf-8") as f:
              style = json.load(f)
          if not style.get("sources") or not style.get("layers"):
              raise SystemExit("Neshan native MapLibre style has no sources or layers.")
          print("Neshan native MapLibre style check passed.")
          PY
      - name: Install Capacitor tooling
        run: npm install --global @capacitor/cli@7
      - name: Verify persistent native Android project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Persistent native Android project is present."
      - name: Build three independent app variants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sptzdfopwkxdprtqjocw' }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          NESHAN_ANDROID_MAP_KEY: ${{ secrets.NESHAN_ANDROID_MAP_KEY || secrets.NESHAN_MOBILE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NESHAN_ANDROID_MAP_KEY" ]; then
            echo "::error::Set the dedicated Android SDK key as NESHAN_ANDROID_MAP_KEY (or NESHAN_MOBILE_KEY) in GitHub Actions secrets. Do not use the Web map key here."
            exit 1
          fi
          mkdir -p dist
          for target in passenger driver admin; do
            case "$target" in
              passenger) flavor="Passenger" ;;
              driver) flavor="Driver" ;;
              admin) flavor="Admin" ;;
            esac
            echo "=== Building $target app ==="
            VITE_APP_TARGET="$target" bun run build
            test -s .output/public/_shell.html
            cp .output/public/_shell.html .output/public/index.html
            npx cap sync android
            (cd android && chmod +x gradlew && ./gradlew "assemble${flavor}Debug")
            APK="android/app/build/outputs/apk/$target/debug/app-$target-debug.apk"
            test -s "$APK"
            cp "$APK" "dist/safar-yar-$target-debug.apk"
            echo "Built $target APK:"
            ls -lh "dist/safar-yar-$target-debug.apk"
          done
      - name: Verify all three APKs and their Android capabilities
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          for target in passenger driver admin; do
            APK="dist/safar-yar-$target-debug.apk"
            test -s "$APK"
            BADGING="$("$AAPT" dump badging "$APK")"
            EXPECTED_PACKAGE="com.hamidwalkingdead.safaryartorkman.$target"
            echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'" || {
              echo "::error::Unexpected applicationId in $target APK"
              exit 1
            }
            PERMISSIONS="$("$AAPT" dump permissions "$APK")"
            MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
            for permission in \
              android.permission.ACCESS_FINE_LOCATION \
              android.permission.ACCESS_COARSE_LOCATION \
              android.permission.FOREGROUND_SERVICE \
              android.permission.FOREGROUND_SERVICE_LOCATION \
              android.permission.POST_NOTIFICATIONS; do
              echo "$PERMISSIONS" | grep -q "$permission" || {
                echo "::error::Missing $permission in $target APK"
                exit 1
              }
            done
            echo "$MANIFEST" | grep -q "com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService"
            echo "$MANIFEST" | grep -q "foregroundServiceType"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor-community/background-geolocation"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor/local-notifications"
            unzip -p "$APK" assets/capacitor.config.json | grep -q '"useLegacyBridge": true'
            echo "$target APK verified."
          done
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-three-apps-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

