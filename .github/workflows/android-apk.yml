# Build and verify three independent Android APKs (passenger, driver, admin).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "android/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.json"

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
      - name: Run project tests
        run: bun run test
      - name: Verify mobile runtime configuration
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Supabase URL is missing."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Supabase publishable key is missing."; exit 1; }
          test -n "$NESHAN_MAP_KEY" || { echo "::error::NESHAN_MAP_KEY is missing; driver/admin Neshan map renderer cannot load."; exit 1; }
          test -n "$VITE_MAPIR_API_KEY" || { echo "::error::MAPIR_API_KEY is missing; passenger Map.ir map and services cannot load."; exit 1; }
          echo "Supabase, driver/admin Neshan, and passenger Map.ir configuration are present."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
      - name: Verify Supabase, Map.ir passenger services and Neshan map renderer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_STATUS="$(curl -sS --max-time 15 -o /tmp/supabase-health.json -w '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")"
          test "$SUPABASE_STATUS" = "200" || { echo "::error::Supabase Auth health returned HTTP $SUPABASE_STATUS."; exit 1; }
          echo "Supabase Auth health check passed."

          curl -fsS --retry 2 --max-time 25 \
            "https://map.ir/reverse?lat=37.25&lon=55.17" \
            -H "x-api-key: $VITE_MAPIR_API_KEY" \
            -H "Mapir-SDK: reactjs" -o /tmp/mapir-reverse.json
          python3 - <<'PY'
          import json
          with open("/tmp/mapir-reverse.json", encoding="utf-8") as f:
              payload = json.load(f)
          address = payload.get("address_compact") or payload.get("address") or payload.get("name") or ""
          if not address:
              raise SystemExit("Map.ir reverse geocoding returned no address for the Gonbad Kavus test point.")
          print("Live Map.ir reverse geocoding passed.")
          PY

          curl -fsS --retry 2 --max-time 25 \
            "https://map.ir/vector/styles/main/mapir-style-dark.json" \
            -H "x-api-key: $VITE_MAPIR_API_KEY" \
            -H "Mapir-SDK: reactjs" -o /tmp/mapir-dark-style.json
          python3 - <<'PY'
          import json
          with open("/tmp/mapir-dark-style.json", encoding="utf-8") as f:
              style = json.load(f)
          if not style.get("sources") or not style.get("layers"):
              raise SystemExit("Map.ir dark vector style has no sources or layers.")
          print("Live Map.ir dark vector style passed.")
          PY

          curl -fsS --retry 2 --max-time 25 \
            -X POST "https://map.ir/search" \
            -H "x-api-key: $VITE_MAPIR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"text":"گنبد کاووس","returnid":true,"location":{"type":"Point","coordinates":[55.17,37.25]}}' \
            -o /tmp/mapir-search.json
          python3 - <<'PY'
          import json
          with open("/tmp/mapir-search.json", encoding="utf-8") as f:
              payload = json.load(f)
          if not any(item.get("Coordinate", {}).get("lat") and item.get("Coordinate", {}).get("lon") for item in payload.get("value", [])):
              raise SystemExit("Map.ir search did not return a usable Gonbad Kavus coordinate.")
          print("Live Map.ir place search passed.")
          PY

          curl -fsS --retry 2 --max-time 25 \
            "https://map.ir/routes/route/v1/driving/55.17,37.25;55.18,37.26?alternatives=false&steps=false&overview=full&geometries=polyline6" \
            -H "x-api-key: $VITE_MAPIR_API_KEY" \
            -H "Mapir-SDK: reactjs" -o /tmp/mapir-route.json
          python3 - <<'PY'
          import json
          with open("/tmp/mapir-route.json", encoding="utf-8") as f:
              payload = json.load(f)
          routes = payload.get("routes") or []
          if payload.get("code") not in ("ok", "Ok") or not routes:
              raise SystemExit("Map.ir route service did not return a route for the Gonbad Kavus test points.")
          route = routes[0]
          if not route.get("geometry") or not route.get("distance") or not route.get("duration"):
              raise SystemExit("Map.ir route response is missing polyline6 geometry or route metrics.")
          print("Live Map.ir road routing passed.")
          PY

          if curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --max-time 20 \
            'https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.js' -o /tmp/neshan-leaflet.js; then
            test -s /tmp/neshan-leaflet.js
            echo "Neshan Leaflet map renderer CDN check passed."
          else
            echo "::warning::Neshan Leaflet CDN returned an error from the GitHub runner; continuing with the real app build. Neshan remains the map provider for driver/admin builds."
          fi

          if curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --max-time 20 \
            'https://static.neshan.org/sdk/maplibre/styles/light.json' -o /tmp/neshan-maplibre-style.json; then
            python3 - <<'PY'
          import json
          with open("/tmp/neshan-maplibre-style.json", encoding="utf-8") as f:
              style = json.load(f)
          if not style.get("sources") or not style.get("layers"):
              raise SystemExit("Neshan native MapLibre style has no sources or layers.")
          print("Neshan native MapLibre style check passed.")
          PY
          else
            echo "::warning::Neshan MapLibre style CDN is temporarily unavailable from the GitHub runner; continuing with the real app build."
          fi
      - name: Install Capacitor tooling
        run: npm install --global @capacitor/cli@7
      - name: Verify persistent native Android project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Persistent native Android project is present."
      - name: Build three independent app variants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sptzdfopwkxdprtqjocw' }}
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
          NESHAN_ANDROID_MAP_KEY: ${{ secrets.NESHAN_ANDROID_MAP_KEY || secrets.NESHAN_MOBILE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NESHAN_ANDROID_MAP_KEY" ]; then
            echo "::error::Set the dedicated Android SDK key as NESHAN_ANDROID_MAP_KEY (or NESHAN_MOBILE_KEY) in GitHub Actions secrets. Do not use the Web map key here."
            exit 1
          fi
          mkdir -p dist
          for target in passenger driver admin; do
            case "$target" in
              passenger) flavor="Passenger" ;;
              driver) flavor="Driver" ;;
              admin) flavor="Admin" ;;
            esac
            echo "=== Building $target app ==="
            VITE_APP_TARGET="$target" bun run build
            test -s .output/public/_shell.html
            cp .output/public/_shell.html .output/public/index.html
            npx cap sync android
            (cd android && chmod +x gradlew && ./gradlew "assemble${flavor}Debug")
            APK="android/app/build/outputs/apk/$target/debug/app-$target-debug.apk"
            test -s "$APK"
            cp "$APK" "dist/safar-yar-$target-debug.apk"
            echo "Built $target APK:"
            ls -lh "dist/safar-yar-$target-debug.apk"
          done
      - name: Verify all three APKs and their Android capabilities
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          for target in passenger driver admin; do
            APK="dist/safar-yar-$target-debug.apk"
            test -s "$APK"
            BADGING="$("$AAPT" dump badging "$APK")"
            EXPECTED_PACKAGE="com.hamidwalkingdead.safaryartorkman.$target"
            echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'" || {
              echo "::error::Unexpected applicationId in $target APK"
              exit 1
            }
            PERMISSIONS="$("$AAPT" dump permissions "$APK")"
            MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
            for permission in \
              android.permission.ACCESS_FINE_LOCATION \
              android.permission.ACCESS_COARSE_LOCATION \
              android.permission.FOREGROUND_SERVICE \
              android.permission.FOREGROUND_SERVICE_LOCATION \
              android.permission.POST_NOTIFICATIONS; do
              echo "$PERMISSIONS" | grep -q "$permission" || {
                echo "::error::Missing $permission in $target APK"
                exit 1
              }
            done
            echo "$MANIFEST" | grep -q "com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService"
            echo "$MANIFEST" | grep -q "foregroundServiceType"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor-community/background-geolocation"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor/local-notifications"
            unzip -p "$APK" assets/capacitor.config.json | grep -q '"useLegacyBridge": true'
            echo "$target APK verified."
          done
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-three-apps-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

