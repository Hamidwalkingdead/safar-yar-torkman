# Build and verify three independent Android APKs (passenger, driver, admin).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, ui/driver-commission-profile-settlement, feat/driver-gallery-and-permanent-code-login, feat/driver-user-number-password, feat/passenger-otp-and-contextual-experience]
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "android/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "drizzle/migrations/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.json"

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
      - name: Run project tests
        run: bun run test
      - name: Verify mobile runtime configuration
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Supabase URL is missing."; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Supabase publishable key is missing."; exit 1; }
          test -n "$MAPIR_API_KEY" || { echo "::error::MAPIR_API_KEY secret is missing; passenger Map.ir cannot load."; exit 1; }
          MAPIR_STATUS="$(curl -sS --max-time 20 -o /tmp/mapir-reverse.json -w '%{http_code}' "https://map.ir/reverse?lat=37.25&lon=55.17" -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs")"
          test "$MAPIR_STATUS" = "200" || { echo "::error::Map.ir reverse geocoding returned HTTP $MAPIR_STATUS."; exit 1; }
          echo "Live Map.ir reverse-geocoding check passed."

          # The reverse endpoint alone does not prove that the vector map can
          # render. Validate the actual dark style and one live vector tile too.
          MAPIR_STYLE_STATUS="$(curl -sS --max-time 25 -o /tmp/mapir-style.json -w '%{http_code}' \
            'https://map.ir/vector/styles/main/mapir-style-dark.json' \
            -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs")"
          test "$MAPIR_STYLE_STATUS" = "200" || { echo "::error::Map.ir dark vector style returned HTTP $MAPIR_STYLE_STATUS."; exit 1; }
          python3 - <<'PY'
          import json, math, os
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          with open("/tmp/mapir-style.json", encoding="utf-8") as f:
              style = json.load(f)
          if not style.get("sources") or not style.get("layers"):
              raise SystemExit("Map.ir dark style has no sources or layers.")
          templates = []
          headers = {"x-api-key": os.environ["MAPIR_API_KEY"], "Mapir-SDK": "reactjs"}
          for source in style["sources"].values():
              templates.extend(source.get("tiles") or [])
              tilejson_url = source.get("url")
              if tilejson_url and not source.get("tiles"):
                  request = Request(tilejson_url, headers=headers)
                  with urlopen(request, timeout=20) as response:
                      tilejson = json.load(response)
                  templates.extend(tilejson.get("tiles") or [])
          if not templates:
              raise SystemExit("Map.ir dark style contains no usable vector tile URL templates.")
          # Gonbad-e Kavus, zoom 12: exercise the same XYZ tile endpoint used
          # by the passenger map rather than only checking geocoding.
          z = 12
          lon, lat = 55.17, 37.25
          n = 2 ** z
          x = int((lon + 180.0) / 360.0 * n)
          lat_rad = math.radians(lat)
          y = int((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n)
          url = templates[0].replace("{z}", str(z)).replace("{x}", str(x)).replace("{y}", str(y)).replace("{ratio}", "")
          if "{" in url:
              raise SystemExit("Map.ir tile URL uses unsupported placeholders; manual validation required: " + url)
          tile_host = (urlparse(url).hostname or "").lower()
          if tile_host != "map.ir" and not tile_host.endswith(".map.ir"):
              raise SystemExit("Map.ir vector tiles use a host not authenticated by the app's transformRequest: " + tile_host)
          with open("/tmp/mapir-tile-url.txt", "w", encoding="utf-8") as f:
              f.write(url)
          print("Map.ir dark style JSON and vector tile template validated.")
          PY
          MAPIR_TILE_URL="$(cat /tmp/mapir-tile-url.txt)"
          MAPIR_TILE_STATUS="$(curl -sS --max-time 25 -o /tmp/mapir-sample-tile.pbf -w '%{http_code}' \
            "$MAPIR_TILE_URL" -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs")"
          test "$MAPIR_TILE_STATUS" = "200" || { echo "::error::Map.ir vector tile returned HTTP $MAPIR_TILE_STATUS."; exit 1; }
          test -s /tmp/mapir-sample-tile.pbf
          echo "Live Map.ir dark style and vector tile checks passed."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
      - name: Verify Supabase and Balad address fallback
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
        run: |
          set -euo pipefail
          SUPABASE_STATUS="$(curl -sS --max-time 15 -o /tmp/supabase-health.json -w '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")"
          test "$SUPABASE_STATUS" = "200" || { echo "::error::Supabase Auth health returned HTTP $SUPABASE_STATUS."; exit 1; }
          echo "Supabase Auth health check passed."

          curl -fsS --retry 2 --max-time 25 \
            -X POST "$VITE_SUPABASE_URL/functions/v1/neshan-reverse" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"lat":37.25,"lng":55.17}' -o /tmp/balad-reverse.json
          python3 - <<'PY'
          import json
          with open("/tmp/balad-reverse.json", encoding="utf-8") as f:
              payload = json.load(f)
          if "گنبد کاووس" not in (payload.get("name") or ""):
              raise SystemExit("Live Balad reverse geocoding did not return a Gonbad Kavus address.")
          print("Live Balad reverse-geocoding passed.")
          PY
      - name: Install Capacitor tooling
        run: npm install --global @capacitor/cli@7
      - name: Verify persistent native Android project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Persistent native Android project is present."
      - name: Build three independent app variants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sptzdfopwkxdprtqjocw' }}
          VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in passenger driver admin; do
            case "$target" in
              passenger) flavor="Passenger" ;;
              driver) flavor="Driver" ;;
              admin) flavor="Admin" ;;
            esac
            echo "=== Building $target app ==="
            VITE_APP_TARGET="$target" bun run build
            test -s .output/public/_shell.html
            cp .output/public/_shell.html .output/public/index.html
            npx cap sync android
            (cd android && chmod +x gradlew && ./gradlew "assemble${flavor}Debug")
            APK="android/app/build/outputs/apk/$target/debug/app-$target-debug.apk"
            test -s "$APK"
            cp "$APK" "dist/safar-yar-$target-debug.apk"
            echo "Built $target APK:"
            ls -lh "dist/safar-yar-$target-debug.apk"
          done
      - name: Verify all three APKs and their Android capabilities
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          for target in passenger driver admin; do
            APK="dist/safar-yar-$target-debug.apk"
            test -s "$APK"
            BADGING="$("$AAPT" dump badging "$APK")"
            EXPECTED_PACKAGE="com.hamidwalkingdead.safaryartorkman.$target"
            echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'" || {
              echo "::error::Unexpected applicationId in $target APK"
              exit 1
            }
            PERMISSIONS="$("$AAPT" dump permissions "$APK")"
            MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
            for permission in \
              android.permission.ACCESS_FINE_LOCATION \
              android.permission.ACCESS_COARSE_LOCATION \
              android.permission.FOREGROUND_SERVICE \
              android.permission.FOREGROUND_SERVICE_LOCATION \
              android.permission.POST_NOTIFICATIONS; do
              echo "$PERMISSIONS" | grep -q "$permission" || {
                echo "::error::Missing $permission in $target APK"
                exit 1
              }
            done
            echo "$MANIFEST" | grep -q "com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService"
            echo "$MANIFEST" | grep -q "foregroundServiceType"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor-community/background-geolocation"
            unzip -p "$APK" assets/capacitor.plugins.json | grep -q "@capacitor/local-notifications"
            unzip -p "$APK" assets/capacitor.config.json | grep -q '"useLegacyBridge": true'
            echo "$target APK verified."
          done
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-three-apps-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

