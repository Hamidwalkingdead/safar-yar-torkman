name: Safar Yar Remote Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        type: choice
        options: [verify, lint, test, build, migrate]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: safar-yar-remote-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRIP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/trip_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run task
        env:
          TASK: ${{ inputs.task || 'verify' }}
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: |
          case "$TASK" in
            verify) bun run lint && bun run test && bun run build ;;
            lint) bun run lint ;;
            test) bun run test ;;
            build) bun run build ;;
            migrate) test -n "$LOVABLE_DB_MIGRATION_URL" && bunx drizzle-kit migrate ;;
            *) exit 2 ;;
          esac
