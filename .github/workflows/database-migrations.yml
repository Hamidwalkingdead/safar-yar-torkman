name: Apply Safar Yar database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safar-yar-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration files
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          const dir = "supabase/migrations";
          const files = readdirSync(dir).filter((name) => name.endsWith(".sql")).sort();
          if (!files.length) throw new Error("No Supabase migrations found.");
          const versions = new Set();
          for (const file of files) {
            const match = file.match(/^(\d{14})_([a-z0-9_]+)\.sql$/);
            if (!match) throw new Error(`Invalid migration filename: ${file}`);
            if (versions.has(match[1])) throw new Error(`Duplicate migration version: ${match[1]}`);
            versions.add(match[1]);
            if (!readFileSync(`${dir}/${file}`, "utf8").trim()) {
              throw new Error(`Empty migration: ${file}`);
            }
          }
          console.log(`Validated ${files.length} Supabase migrations.`);
          NODE

      - name: Verify migration credential
        env:
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: |
          test -n "$LOVABLE_DB_MIGRATION_URL" || {
            echo "::error::Add LOVABLE_DB_MIGRATION_URL to repository Actions secrets."
            exit 1
          }

      - name: Apply pending Supabase migrations
        env:
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: supabase migration up --remote="$LOVABLE_DB_MIGRATION_URL"
