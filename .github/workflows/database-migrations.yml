name: Apply Safar Yar database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safar-yar-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Use the exact branch selected in the Actions "Run workflow" form.
      # Checking out main here silently skipped migrations that exist only on a PR branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify migration journal matches SQL files
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          const dir = "drizzle/migrations";
          const journal = JSON.parse(readFileSync(`${dir}/meta/_journal.json`, "utf8"));
          const entries = journal.entries ?? [];
          if (journal.dialect !== "postgresql" || entries.length === 0) {
            throw new Error("Invalid or empty PostgreSQL migration journal");
          }
          const expected = new Set();
          entries.forEach((entry, index) => {
            if (entry.idx !== index || !entry.tag || expected.has(entry.tag)) {
              throw new Error(`Invalid/duplicate migration journal entry at index ${index}`);
            }
            expected.add(entry.tag);
            const file = `${dir}/${entry.tag}.sql`;
            try {
              const sql = readFileSync(file, "utf8");
              if (!sql.trim()) throw new Error("empty SQL");
            } catch {
              throw new Error(`Missing or empty migration: ${file}`);
            }
          });
          const actual = new Set(readdirSync(dir).filter((name) => /^\d+_.+\.sql$/.test(name)).map((name) => name.slice(0, -4)));
          for (const tag of actual) {
            if (!expected.has(tag)) throw new Error(`Unjournaled SQL migration: ${tag}.sql`);
          }
          console.log(`Validated ${entries.length} ordered PostgreSQL migrations.`);
          NODE
      - name: Verify migration credential
        env:
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: test -n "$LOVABLE_DB_MIGRATION_URL"
      - name: Apply pending migrations
        env:
          LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL }}
        run: bunx drizzle-kit migrate
