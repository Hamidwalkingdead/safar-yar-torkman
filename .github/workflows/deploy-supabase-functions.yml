name: Deploy Safar Yar Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safar-yar-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NESHAN_SERVICE_KEY: ${{ secrets.NESHAN_SERVICE_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN to repository Actions secrets."; exit 1; }
          test -n "$NESHAN_SERVICE_KEY" || { echo "::error::Add NESHAN_SERVICE_KEY to repository Actions secrets."; exit 1; }
      - name: Configure private Neshan key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NESHAN_SERVICE_KEY: ${{ secrets.NESHAN_SERVICE_KEY }}
        run: supabase secrets set NESHAN_SERVICE_KEY="$NESHAN_SERVICE_KEY" --project-ref sptzdfopwkxdprtqjocw
      - name: Deploy authenticated Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-trip --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-route --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-reverse --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-search --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy kavenegar-send-sms --project-ref sptzdfopwkxdprtqjocw
      - name: Configure Kavenegar Auth SMS hook when credentials are available
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          KAVENEGAR_SENDER: ${{ secrets.KAVENEGAR_SENDER }}
          KAVENEGAR_VERIFY_TEMPLATE: ${{ secrets.KAVENEGAR_VERIFY_TEMPLATE }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
        run: |
          if [ -n "$KAVENEGAR_API_KEY" ] && [ -n "$SEND_SMS_HOOK_SECRET" ] && { [ -n "$KAVENEGAR_SENDER" ] || [ -n "$KAVENEGAR_VERIFY_TEMPLATE" ]; }; then
            supabase secrets set \
              KAVENEGAR_API_KEY="$KAVENEGAR_API_KEY" \
              KAVENEGAR_SENDER="$KAVENEGAR_SENDER" \
              KAVENEGAR_VERIFY_TEMPLATE="$KAVENEGAR_VERIFY_TEMPLATE" \
              SEND_SMS_HOOK_SECRET="$SEND_SMS_HOOK_SECRET" \
              --project-ref sptzdfopwkxdprtqjocw
            # Publish the HTTP Send SMS Auth Hook configuration only after all
            # provider credentials and the Standard Webhooks signing secret exist.
            supabase config push --remote=sptzdfopwkxdprtqjocw --yes
          else
            echo "::warning::Kavenegar credentials or Supabase Auth Hook secret are missing; the SMS hook is deployed but not configured."
          fi
