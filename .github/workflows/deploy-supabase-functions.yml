name: Deploy Safar Yar Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safar-yar-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add SUPABASE_ACCESS_TOKEN to repository Actions secrets."; exit 1; }
      - name: Keep guest sessions enabled
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.supabase.com/v1/projects/sptzdfopwkxdprtqjocw/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"external_anonymous_users_enabled":true}'
      - name: Deploy authenticated Edge Functions with Balad services
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-trip --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-route --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-reverse --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy neshan-search --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy enroute-pickup --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy invite-admin --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy passenger-phone-auth --project-ref sptzdfopwkxdprtqjocw
          supabase functions deploy driver-phone-auth --project-ref sptzdfopwkxdprtqjocw
