name: Passenger Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/passenger-mapir-apk.yml"
      - "src/**"
      - "android/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.json"

permissions:
  contents: read

jobs:
  passenger-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
      - name: Run project tests
        run: bun run test
      - name: Verify live Map.ir services
        env:
          MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MAPIR_API_KEY" || { echo "::error::MAPIR_API_KEY secret is missing."; exit 1; }
          curl -fsS --retry 2 --max-time 25 "https://map.ir/reverse?lat=37.25&lon=55.17" -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs" -o /tmp/reverse.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/reverse.json",encoding="utf-8"))
          if not (p.get("address_compact") or p.get("address") or p.get("name")):
              raise SystemExit("Map.ir reverse geocoding returned no address.")
          print("Map.ir reverse geocoding OK")
          PY
          curl -fsS --retry 2 --max-time 25 "https://map.ir/vector/styles/main/mapir-style-dark.json" -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs" -o /tmp/style.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/style.json",encoding="utf-8"))
          if not p.get("sources") or not p.get("layers"):
              raise SystemExit("Map.ir dark style is invalid.")
          print("Map.ir dark style OK")
          PY
          curl -fsS --retry 2 --max-time 25 -X POST "https://map.ir/search" -H "x-api-key: $MAPIR_API_KEY" -H "Content-Type: application/json" -d '{"text":"گنبد کاووس","returnid":true,"location":{"type":"Point","coordinates":[55.17,37.25]}}' -o /tmp/search.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/search.json",encoding="utf-8"))
          if not any(x.get("Coordinate",{}).get("lat") and x.get("Coordinate",{}).get("lon") for x in p.get("value",[])):
              raise SystemExit("Map.ir search returned no usable coordinates.")
          print("Map.ir search OK")
          PY
          curl -fsS --retry 2 --max-time 25 "https://map.ir/routes/route/v1/driving/55.17,37.25;55.18,37.26?alternatives=false&steps=false&overview=full&geometries=polyline6" -H "x-api-key: $MAPIR_API_KEY" -H "Mapir-SDK: reactjs" -o /tmp/route.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/route.json",encoding="utf-8"))
          r=(p.get("routes") or [{}])[0]
          if p.get("code") not in ("ok","Ok") or not r.get("geometry") or not r.get("distance") or not r.get("duration"):
              raise SystemExit("Map.ir road routing failed.")
          print("Map.ir road routing OK")
          PY
      - name: Build passenger web assets
        env:
          VITE_APP_TARGET: passenger
          VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sptzdfopwkxdprtqjocw' }}
        run: |
          set -euo pipefail
          bun run build
          test -s .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
      - name: Install Capacitor tooling and sync Android
        run: |
          npm install --global @capacitor/cli@7
          npx cap sync android
      - name: Assemble passenger APK only
        run: |
          set -euo pipefail
          test -f android/gradlew
          cd android
          chmod +x gradlew
          ./gradlew assemblePassengerDebug
          test -s app/build/outputs/apk/passenger/debug/app-passenger-debug.apk
      - name: Verify passenger APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/passenger/debug/app-passenger-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.hamidwalkingdead.safaryartorkman.passenger'"
          mkdir -p dist
          cp "$APK" dist/safar-yar-torkman-passenger-debug.apk
          sha256sum dist/safar-yar-torkman-passenger-debug.apk
          ls -lh dist/safar-yar-torkman-passenger-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-passenger-debug
          path: dist/safar-yar-torkman-passenger-debug.apk
          if-no-files-found: error
          retention-days: 14
