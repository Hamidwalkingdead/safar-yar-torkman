name: Passenger Map.ir test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passenger-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_TARGET: passenger
      VITE_MAPIR_API_KEY: ${{ secrets.MAPIR_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://sptzdfopwkxdprtqjocw.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Ly20NA7eN5WO_plU2Pznug_YJTTE3vp' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/passenger-mapir-provider
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify passenger-only configuration
        run: |
          set -euo pipefail
          test -n "$VITE_MAPIR_API_KEY" || { echo "::error::Add repository secret MAPIR_API_KEY before building."; exit 1; }
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests and checks
        run: |
          bun run test
          bunx eslint src/components/passenger-mapir-picker.tsx src/lib/mapir.functions.ts src/routes/passenger.tsx
          bunx tsc --noEmit -p tsconfig.mapir.json
      - name: Build passenger web shell
        run: |
          set -euo pipefail
          bun run build
          test -s .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
      - name: Install Capacitor CLI
        run: npm install --global @capacitor/cli@7
      - name: Sync Android passenger app
        run: npx cap sync android
      - name: Build passenger APK only
        working-directory: android
        run: ./gradlew :app:assemblePassengerDebug --no-daemon
      - name: Verify passenger APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/passenger/debug/app-passenger-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | grep -q "com.hamidwalkingdead.safaryartorkman.passenger"
          echo "Passenger-only APK verified. Driver/admin APKs were not built."
      - uses: actions/upload-artifact@v4
        with:
          name: safar-yar-torkman-passenger-mapir-test-apk
          path: android/app/build/outputs/apk/passenger/debug/app-passenger-debug.apk
          if-no-files-found: error
          retention-days: 14
